<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8fd6"/>
      <stop offset="1" stop-color="#bfe3f7"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04061a"/>
      <stop offset="1" stop-color="#1b2552"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/>
    </radialGradient>
    <!-- diagonal from top-left to bottom-right: day above-right, night below-left -->
    <clipPath id="dayHalf"><polygon points="0,0 1600,0 1600,2000"/></clipPath>
    <clipPath id="nightHalf"><polygon points="0,0 1600,2000 0,2000"/></clipPath>
  </defs>

  <!-- DAY -->
  <g clip-path="url(#dayHalf)">
    <rect width="1600" height="2000" fill="url(#day)"/>
    <circle cx="1180" cy="560" r="300" fill="url(#sunGlow)"/>
    <circle cx="1180" cy="560" r="110" fill="#ffd84d"/>
    <g fill="#ffffff" opacity="0.92">
      <path d="M760 330 a60 60 0 0 1 110 -30 a75 75 0 0 1 135 25 a50 50 0 0 1 10 95 h-245 a50 50 0 0 1 -10 -90 z"/>
      <path d="M1240 980 a55 55 0 0 1 100 -25 a70 70 0 0 1 125 25 a45 45 0 0 1 5 85 h-225 a45 45 0 0 1 -5 -85 z"/>
      <path d="M1360 240 a40 40 0 0 1 75 -18 a50 50 0 0 1 90 18 a32 32 0 0 1 3 62 h-165 a32 32 0 0 1 -3 -62 z"/>
    </g>
  </g>

  <!-- NIGHT -->
  <g clip-path="url(#nightHalf)">
    <rect width="1600" height="2000" fill="url(#night)"/>
    <circle cx="420" cy="1440" r="260" fill="url(#moonGlow)"/>
    <!-- crescent moon -->
    <path d="M470 1340 a110 110 0 1 0 0 200 a90 90 0 1 1 0 -200 z" fill="#f2f4ff"/>
    <g fill="#ffffff">
      <circle cx="140" cy="900" r="3" opacity="0.9"/><circle cx="260" cy="1100" r="2" opacity="0.7"/>
      <circle cx="90" cy="1250" r="2.5" opacity="0.8"/><circle cx="660" cy="1260" r="2" opacity="0.6"/>
      <circle cx="220" cy="1700" r="3" opacity="0.9"/><circle cx="700" cy="1650" r="2.2" opacity="0.7"/>
      <circle cx="900" cy="1820" r="2.6" opacity="0.8"/><circle cx="1120" cy="1900" r="2" opacity="0.6"/>
      <circle cx="80" cy="600" r="2" opacity="0.6"/><circle cx="380" cy="1000" r="1.6" opacity="0.5"/>
      <circle cx="560" cy="1500" r="1.6" opacity="0.5"/><circle cx="820" cy="1520" r="2.4" opacity="0.8"/>
      <circle cx="120" cy="1550" r="1.8" opacity="0.6"/><circle cx="460" cy="1880" r="2" opacity="0.7"/>
    </g>
    <!-- twinkle -->
    <g fill="#ffffff" opacity="0.9">
      <path d="M300 1280 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6 z"/>
      <path d="M760 1760 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z"/>
    </g>
  </g>

  <!-- seam -->
  <line x1="0" y1="0" x2="1600" y2="2000" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
</svg>
