<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.45" stop-color="#2a3566"/>
      <stop offset="0.75" stop-color="#7a6f9b"/>
      <stop offset="1" stop-color="#d9b8b0"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6ea"/>
      <stop offset="1" stop-color="#8e9ac0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>
    <symbol id="pine" viewBox="0 0 100 220">
      <rect x="45" y="190" width="10" height="30"/>
      <polygon points="50,0 72,55 62,55 84,105 70,105 94,160 64,160 100,200 0,200 36,160 6,160 30,105 16,105 38,55 28,55"/>
    </symbol>
  </defs>

  <rect width="1600" height="2000" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="2" opacity="0.8"/><circle cx="310" cy="260" r="1.5" opacity="0.6"/>
    <circle cx="460" cy="90" r="2.2" opacity="0.9"/><circle cx="640" cy="320" r="1.4" opacity="0.5"/>
    <circle cx="820" cy="170" r="1.8" opacity="0.7"/><circle cx="980" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="1450" cy="210" r="2" opacity="0.8"/><circle cx="1530" cy="420" r="1.4" opacity="0.5"/>
    <circle cx="220" cy="480" r="1.6" opacity="0.6"/><circle cx="720" cy="520" r="1.2" opacity="0.4"/>
    <circle cx="1080" cy="380" r="1.6" opacity="0.6"/><circle cx="1320" cy="560" r="1.2" opacity="0.4"/>
    <circle cx="60" cy="700" r="1.3" opacity="0.4"/><circle cx="560" cy="680" r="1.1" opacity="0.35"/>
  </g>

  <!-- moon -->
  <circle cx="1180" cy="330" r="260" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="330" r="80" fill="#fff6dc"/>

  <!-- distant hills -->
  <path d="M0 1180 C 220 1080 420 1120 620 1060 C 820 1000 1000 1090 1200 1040 C 1380 995 1500 1050 1600 1020 L1600 2000 L0 2000 Z" fill="#4a4f7d" opacity="0.8"/>

  <!-- far tree line -->
  <g fill="#2c3260">
    <use href="#pine" x="20" y="1010" width="70" height="154"/>
    <use href="#pine" x="90" y="1040" width="56" height="123"/>
    <use href="#pine" x="300" y="1000" width="64" height="141"/>
    <use href="#pine" x="360" y="1030" width="52" height="114"/>
    <use href="#pine" x="900" y="990" width="66" height="145"/>
    <use href="#pine" x="960" y="1020" width="54" height="119"/>
    <use href="#pine" x="1380" y="960" width="70" height="154"/>
    <use href="#pine" x="1450" y="990" width="58" height="128"/>
    <use href="#pine" x="1520" y="975" width="64" height="141"/>
  </g>

  <!-- frozen lake -->
  <path d="M380 1230 C 600 1200 1000 1200 1240 1235 C 1100 1280 600 1285 380 1230 Z" fill="#b9c3e3" opacity="0.6"/>

  <!-- snowy field -->
  <path d="M0 1260 C 300 1200 520 1300 800 1270 C 1080 1240 1300 1300 1600 1240 L1600 2000 L0 2000 Z" fill="url(#snow)"/>

  <!-- near woods -->
  <g fill="#161a36">
    <use href="#pine" x="-60" y="900" width="200" height="440"/>
    <use href="#pine" x="90" y="980" width="150" height="330"/>
    <use href="#pine" x="200" y="1050" width="110" height="242"/>
    <use href="#pine" x="1280" y="1000" width="140" height="308"/>
    <use href="#pine" x="1380" y="920" width="190" height="418"/>
    <use href="#pine" x="1500" y="1010" width="140" height="308"/>
  </g>

  <!-- snow on near ground -->
  <path d="M0 1320 C 260 1290 480 1360 760 1350 C 1040 1340 1300 1380 1600 1320 L1600 2000 L0 2000 Z" fill="#e4e9f6" opacity="0.9"/>
</svg>
