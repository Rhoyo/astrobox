<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="studio" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#3a3836"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5f1"/>
      <stop offset="0.6" stop-color="#e4e0d9"/>
      <stop offset="1" stop-color="#c9c4bb"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8b2a8"/>
      <stop offset="1" stop-color="#8d877d"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#e9e5de"/>
    </linearGradient>
    <clipPath id="faceClip">
      <rect x="330" y="560" width="860" height="1020"/>
    </clipPath>
  </defs>

  <rect width="1600" height="2000" fill="url(#studio)"/>
  <!-- floor -->
  <rect y="1580" width="1600" height="420" fill="#141312"/>
  <ellipse cx="830" cy="1600" rx="640" ry="50" fill="#000" opacity="0.55"/>

  <!-- block: top and side -->
  <polygon points="330,560 1190,560 1300,470 440,470" fill="url(#top)"/>
  <polygon points="1190,560 1300,470 1300,1490 1190,1580" fill="url(#side)"/>
  <!-- block: front face -->
  <rect x="330" y="560" width="860" height="1020" fill="url(#face)"/>

  <g clip-path="url(#faceClip)">
    <!-- veins -->
    <g fill="none" stroke="#9a948a" stroke-linecap="round" opacity="0.55">
      <path d="M330 640 C 480 700 520 820 700 860 C 860 900 900 1040 1190 1080" stroke-width="5"/>
      <path d="M420 1580 C 470 1400 640 1360 700 1220 C 760 1080 980 1000 1100 760" stroke-width="3"/>
      <path d="M700 860 C 760 780 840 760 900 640" stroke-width="2"/>
      <path d="M330 1300 C 450 1260 520 1320 600 1280" stroke-width="2"/>
    </g>
    <g fill="none" stroke="#b9a98e" stroke-width="2" opacity="0.45">
      <path d="M980 1580 C 1000 1450 1080 1380 1190 1360"/>
      <path d="M330 900 C 420 940 460 1020 560 1040"/>
    </g>

    <!-- carved grooves: shadow below, highlight above -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#5c574f" stroke-width="16" opacity="0.65">
        <path d="M300 760 C 500 735 700 790 900 755 C 1050 730 1150 770 1220 750"/>
        <path d="M300 900 C 520 870 720 930 920 890 C 1070 865 1150 905 1220 885"/>
        <path d="M300 1040 C 480 1015 700 1075 900 1035 C 1060 1005 1150 1045 1220 1030"/>
        <path d="M300 1180 C 500 1150 700 1215 910 1175 C 1060 1148 1150 1190 1220 1170"/>
        <path d="M300 1320 C 500 1295 690 1355 900 1315 C 1060 1285 1150 1330 1220 1310"/>
        <path d="M300 1460 C 500 1430 710 1495 910 1455 C 1060 1428 1150 1470 1220 1450"/>
      </g>
      <g stroke="#2f2c28" stroke-width="5" opacity="0.6" transform="translate(0 6)">
        <path d="M300 760 C 500 735 700 790 900 755 C 1050 730 1150 770 1220 750"/>
        <path d="M300 900 C 520 870 720 930 920 890 C 1070 865 1150 905 1220 885"/>
        <path d="M300 1040 C 480 1015 700 1075 900 1035 C 1060 1005 1150 1045 1220 1030"/>
        <path d="M300 1180 C 500 1150 700 1215 910 1175 C 1060 1148 1150 1190 1220 1170"/>
        <path d="M300 1320 C 500 1295 690 1355 900 1315 C 1060 1285 1150 1330 1220 1310"/>
        <path d="M300 1460 C 500 1430 710 1495 910 1455 C 1060 1428 1150 1470 1220 1450"/>
      </g>
      <g stroke="#ffffff" stroke-width="4" opacity="0.85" transform="translate(0 -10)">
        <path d="M300 760 C 500 735 700 790 900 755 C 1050 730 1150 770 1220 750"/>
        <path d="M300 900 C 520 870 720 930 920 890 C 1070 865 1150 905 1220 885"/>
        <path d="M300 1040 C 480 1015 700 1075 900 1035 C 1060 1005 1150 1045 1220 1030"/>
        <path d="M300 1180 C 500 1150 700 1215 910 1175 C 1060 1148 1150 1190 1220 1170"/>
        <path d="M300 1320 C 500 1295 690 1355 900 1315 C 1060 1285 1150 1330 1220 1310"/>
        <path d="M300 1460 C 500 1430 710 1495 910 1455 C 1060 1428 1150 1470 1220 1450"/>
      </g>
    </g>
  </g>

  <!-- grooves wrap onto the side -->
  <g fill="none" stroke="#5c574f" stroke-width="10" opacity="0.5">
    <path d="M1190 750 L1300 668"/>
    <path d="M1190 885 L1300 803"/>
    <path d="M1190 1030 L1300 948"/>
    <path d="M1190 1170 L1300 1088"/>
    <path d="M1190 1310 L1300 1228"/>
    <path d="M1190 1450 L1300 1368"/>
  </g>

  <!-- edge highlight -->
  <line x1="330" y1="560" x2="1190" y2="560" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
</svg>
